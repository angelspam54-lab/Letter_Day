# Local production-like stack: app + PostgreSQL.
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: letterday, POSTGRES_DB: letterday }
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:letterday@db:5432/letterday
      PUBLIC_URL: http://localhost:8080
    depends_on: [db]
volumes:
  pgdata:
